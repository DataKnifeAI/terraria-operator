                format: int64
                minimum: 30
                type: integer
              update:
                description: Update configures the TShock release compat watcher.
                properties:
                  autoUpdateImage:
                    description: |-
                      AutoUpdateImage when true may retag to latest stable (Phase 2 apply).
                      Phase 1 is status-only regardless; field is reserved for parity UX.
                    type: boolean
                  checkInterval:
                    default: 6h
                    description: CheckInterval is how often the reconciler polls TShock
