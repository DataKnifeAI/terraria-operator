                    type: string
                type: object
              plugins:
                description: Plugins mounts TShock plugin DLLs (Phase 2 fetch).
                properties:
                  enabled:
                    description: Enabled mounts plugin storage into ServerPlugins/.
                    type: boolean
                  mountRef:
                    description: MountRef is a bring-your-own PVC/ConfigMap name with
