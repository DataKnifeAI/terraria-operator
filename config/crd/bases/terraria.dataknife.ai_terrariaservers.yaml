                    type: string
                  gatewayName:
                    description: GatewayName overrides the Gateway resource name.
                    type: string
                  serviceType:
                    default: ClusterIP
                    description: ServiceType overrides the backing Service type when
                      gateway is disabled.
                    enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                    type: string
                type: object
              imagePullSecrets:
                description: ImagePullSecrets for private registries.
                items:
                  description: |-
