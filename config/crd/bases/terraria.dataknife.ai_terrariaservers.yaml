                format: date-time
                type: string
              latestTShockRelease:
                description: LatestTShockRelease is the newest TShock GitHub release
                  tag (without leading v).
                type: string
              latestTShockTerrariaVersion:
                description: LatestTShockTerrariaVersion is the Terraria version that
