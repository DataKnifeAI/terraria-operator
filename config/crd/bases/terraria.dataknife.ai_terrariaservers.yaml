                type: integer
              phase:
                description: Phase is Pending, Deploying, Running, or Failed.
                type: string
              ready:
                description: Ready is true when the StatefulSet has a ready replica.
                type: boolean
              updateAvailable:
                description: UpdateAvailable is true when installed Terraria < latest
                  TShock-supported.
                type: boolean
